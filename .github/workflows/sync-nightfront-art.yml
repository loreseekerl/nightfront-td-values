name: Sync verified Nightfront Roblox artwork

on:
  push:
    paths:
      - ".github/workflows/sync-nightfront-art.yml"
      - "roblox-art-sync.json"
      - "scripts/sync_nightfront_art.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightfront-roblox-art
  cancel-in-progress: false

jobs:
  export-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Nightfront values repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download real unit thumbnails from Roblox
        run: python scripts/sync_nightfront_art.py
      - name: Publish valid unit artwork to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/roblox-units roblox-art-result.json
          if ! git diff --cached --quiet; then
            git commit -m "Export verified Roblox unit artwork into Nightfront website assets"
            git push origin HEAD:main
          else
            echo "Unit artwork already up to date."
          fi
