name: Audit Nightfront portrait similarity

on:
  push:
    paths:
      - ".github/workflows/audit-nightfront-art.yml"
      - "scripts/audit_nightfront_art.py"
      - "roblox-art-result.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightfront-art-audit
  cancel-in-progress: false

jobs:
  detect-reused-portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out value list
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image audit dependency
        run: python -m pip install "Pillow>=10,<13"
      - name: Compare actual imported Roblox artwork
        run: python scripts/audit_nightfront_art.py
      - name: Prepare contact sheet preview for verification
        run: |
          python - <<'PY'
          import base64
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          image = Image.open("assets/roblox-art-audit.jpg")
          image.thumbnail((1000, 2100))
          memory = BytesIO()
          image.save(memory, format="JPEG", quality=56, optimize=True)
          Path("roblox-art-audit-preview.base64.txt").write_text(
              base64.b64encode(memory.getvalue()).decode("ascii"), encoding="utf-8"
          )
          print("Saved temporary audit preview", memory.tell(), "bytes")
          PY
      - name: Publish audit report and labeled image sheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roblox-art-visual-audit.json assets/roblox-art-audit.jpg roblox-art-audit-preview.base64.txt
          if ! git diff --cached --quiet; then
            git commit -m "Audit Nightfront unit artwork for near-identical portraits"
            # Other approved website edits can land while this audit is running.
            # Rebase our generated report onto the newest main instead of
            # overwriting concurrent changes or losing the audit output.
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo "Audit report published."
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                echo "Could not publish audit after 4 safe retries."
                exit 1
              fi
              sleep 2
            done
          else
            echo "Artwork audit already up to date."
          fi
